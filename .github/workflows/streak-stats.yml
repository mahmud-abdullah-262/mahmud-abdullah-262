name: Update Streak Stats

on:
  schedule:
    - cron: "0 3 * * *"   # প্রতিদিন UTC 03:00 (বাংলাদেশ সময় সকাল ৯টা)
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          user_id: mahmud-abdullah-262
         options: theme=default&hide_border=true&background=ffffff&ring=10b981&fire=10b981&currStreakLabel=10b981
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "chore: update streak stats" || exit 0
          git push
